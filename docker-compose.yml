services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  warp:
    image: caomingjun/warp
    container_name: smarttherm_warp
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    device_cgroup_rules:
      - 'c 10:200 rwm'
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data/warp_data:/var/lib/cloudflare-warp

  admin:
    build: .
    command: ["python", "-m", "app.admin.api"]
    env_file: .env
    ports:
      - "${ADMIN_API_PORT:-8088}:${ADMIN_API_PORT:-8088}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - admin
      - warp
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
