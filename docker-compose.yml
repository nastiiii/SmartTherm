services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  xray:
    image: teddysun/xray:latest
    container_name: smarttherm_xray
    restart: unless-stopped
    volumes:
      - ./data/xray-config.json:/etc/xray/config.json:ro

  admin:
    build: .
    command: ["python", "-m", "app.admin.api"]
    env_file: .env
    ports:
      - "${ADMIN_API_PORT:-8088}:${ADMIN_API_PORT:-8088}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - admin
      - xray
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
